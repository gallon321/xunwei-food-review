{% extends 'base.html' %}
{% block title %}账号设置 · 寻味{% endblock %}
{% block content %}
<section class="auth-card panel"><h1>账号设置</h1><p class="muted">更新密码，保护你的寻味足迹。</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label class="field"><span>当前密码</span><input type="password" name="current_password" autocomplete="current-password" required></label>
<label class="field"><span>新密码</span><input type="password" name="password" minlength="8" maxlength="72" autocomplete="new-password" required></label>
<label class="field"><span>确认新密码</span><input type="password" name="confirm_password" minlength="8" maxlength="72" autocomplete="new-password" required></label>
<button class="btn btn--block">修改密码并重新登录</button></form></section>
{% endblock %}
