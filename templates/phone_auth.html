{% extends "auth_layout.html" %}
{% block title %}手机{{ '注册' if mode == 'register' else '登录' }} · 寻味{% endblock %}
{% block auth_form %}
{% if sms_demo %}<div class="auth-demo"><span class="auth-demo__label">本地演示</span><p>验证码将在下方显示，不会发送真实短信。</p></div>{% endif %}
<form method="post" class="auth-form" id="phone-auth" data-send-url="{{ url_for('phone_auth.send_code') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="purpose" value="{{ mode }}">
  <input type="hidden" name="next" value="{{ request.values.get('next', '') }}">
  <label class="field"><span>手机号</span><input type="tel" name="phone" required pattern="1[3-9][0-9]{9}" maxlength="11" autocomplete="tel-national" placeholder="请输入中国大陆11位手机号" value="{{ request.form.get('phone', '') }}"></label>
  <div class="auth-code-row">
    <label class="field"><span>验证码 <small>5分钟内有效</small></span><input name="code" required pattern="[0-9]{6}" maxlength="6" inputmode="numeric" autocomplete="one-time-code" placeholder="输入6位验证码"></label>
    <button type="button" class="auth-code-button" id="send-code">获取验证码</button>
  </div>
  <p id="sms-message" class="auth-sms-message" role="status" aria-live="polite"></p>
  <button class="btn btn--block auth-submit">{{ '验证并注册' if mode == 'register' else '验证并登录' }} <span aria-hidden="true">→</span></button>
</form>
<script src="{{ url_for('static', filename='phone-auth.js') }}" defer></script>
{% endblock %}
