{% extends 'base.html' %}
{% block title %}菜品管理 · 寻味{% endblock %}
{% block content %}
<nav class="breadcrumb"><a href="{{ url_for('admin.admin_dashboard') }}">管理后台</a> › 菜品管理</nav>
<section class="page-head"><h1>{{ restaurant.name }} · 菜品管理</h1><p class="muted">在这里更新餐厅的招牌菜和价格，保存后会展示在餐厅详情中。</p></section>
<div class="profile-grid"><section class="panel"><h2 class="panel__title">已添加菜品</h2>
{% for d in dishes %}<div class="review">
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="dish_id" value="{{ d.id }}">
<label class="field"><span>菜品名称</span><input name="name" value="{{ d.name }}" required maxlength="80"></label>
<label class="field"><span>价格（元）</span><input type="number" name="price" value="{{ d.price }}" min="0" max="100000" required></label>
<button class="btn">保存修改</button></form>
<form method="post" action="{{ url_for('admin.delete_dish', rid=restaurant.id, dish_id=d.id) }}" onsubmit="return confirm('确定删除这道菜？')"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="link-button danger">删除菜品</button></form>
</div>{% else %}<p class="muted">暂未添加菜品。</p>{% endfor %}</section>
<section class="panel"><h2 class="panel__title">新增菜品</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label class="field"><span>菜品名称</span><input name="name" required maxlength="80" placeholder="例如：招牌回锅肉"></label>
<label class="field"><span>价格（元）</span><input type="number" name="price" required min="0" max="100000"></label>
<button class="btn">添加菜品</button></form></section></div>
{% endblock %}
