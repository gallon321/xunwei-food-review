{% extends "auth_layout.html" %}
{% block title %}{{ '注册' if mode == 'register' else '登录' }} · 寻味{% endblock %}
{% block auth_form %}
<form method="post" class="auth-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="next" value="{{ request.values.get('next', '') }}">
  <label class="field"><span>用户名</span><input name="username" required minlength="3" maxlength="20" autocomplete="username" placeholder="{{ '给自己取一个名字（3–20个字符）' if mode == 'register' else '请输入用户名' }}" value="{{ request.form.get('username', '') }}"></label>
  <label class="field"><span>密码{% if mode == 'register' %}<small>8–72 个字符</small>{% endif %}</span><input type="password" name="password" required minlength="{{ 8 if mode == 'register' else 1 }}" maxlength="72" autocomplete="{{ 'new-password' if mode == 'register' else 'current-password' }}" placeholder="{{ '设置你的登录密码' if mode == 'register' else '请输入密码' }}"></label>
  <button class="btn btn--block auth-submit">{{ '创建账号，开启寻味' if mode == 'register' else '登录寻味' }} <span aria-hidden="true">→</span></button>
</form>
{% endblock %}
